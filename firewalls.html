<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firewalls — Synthetic Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="logo.svg" alt=""> Firewall Documentation System — Synthetic Demo v1.0</div>
  <div class="session">Logged in as DEMO-USER-01 (Synthetic)</div>
</header>
<nav class="tabs">
  <a href="index.html">Home</a>
  <a href="zone-app.html">Zone App</a>
  <a href="request-checker.html">Request Checker</a>
  <a href="firewalls.html" class="active">Firewalls</a>
  <a href="search.html">Search</a>
</nav>

<main>
  <h1>Firewalls</h1>
  <p class="muted" id="totals"></p>
  <div id="groups"></div>
</main>

<script src="common.js"></script>
<script>
fetch('data.json').then(r => r.json()).then(d => {
  const all = d.firewalls_all || d.firewalls;
  const total = Object.values(all).reduce((n, arr) => n + arr.length, 0);
  document.getElementById('totals').textContent =
    `${total} firewalls across ${Object.keys(all).length} categories — ` +
    `${(d.hosts||[]).length + (d.big_hosts||[]).length} hosts, ` +
    `${(d.rules||[]).length + (d.big_rules||[]).length} access rules documented.`;
  const root = document.getElementById('groups');
  const order = ['DC', 'DMZ', 'Cloud', 'AWS', 'Azure', 'OLD'];
  for (const group of order) {
    const devices = all[group];
    if (!devices || !devices.length) continue;
    const card = document.createElement('div');
    card.className = 'card';
    const head = document.createElement('div');
    head.className = 'card-head';
    head.textContent = `${group} (${devices.length})`;
    card.appendChild(head);

    const table = document.createElement('table');
    table.innerHTML = '<tr><th>Firewall</th><th>Rules</th><th>Zones</th><th>Configuration</th></tr>';
    devices.forEach(dev => {
      const tr = document.createElement('tr');
      const zoneChips = (dev.zones || []).map(zoneChip).join(' ');
      tr.innerHTML = `
        <td><a href="firewall-detail.html?id=${dev.id}">${dev.id}</a></td>
        <td>${dev.rules}</td>
        <td>${zoneChips}</td>
        <td><a href="firewall-detail.html?id=${dev.id}&tab=rules">Rules</a> ·
            <a href="firewall-detail.html?id=${dev.id}&tab=groups">Groups</a> ·
            <a href="firewall-detail.html?id=${dev.id}&tab=iface">Iface</a> ·
            <a href="firewall-detail.html?id=${dev.id}&tab=routing">Routing</a></td>`;
      table.appendChild(tr);
    });
    card.appendChild(table);
    root.appendChild(card);
  }
});
</script>
</body>
</html>
