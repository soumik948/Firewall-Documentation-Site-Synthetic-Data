<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firewalls — Synthetic Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="logo.svg" alt=""> Firewall Documentation System — Synthetic Demo v1.0</div>
  <div class="session">Logged in as DEMO-USER-01 (Synthetic)</div>
</header>
<nav class="tabs">
  <a href="index.html">Home</a>
  <a href="zone-app.html">Zone App</a>
  <a href="request-checker.html">Request Checker</a>
  <a href="firewalls.html" class="active">Firewalls</a>
  <a href="search.html">Search</a>
</nav>

<main>
  <h1>Firewalls</h1>
  <div id="groups"></div>
</main>

<script>
fetch('data.json').then(r => r.json()).then(d => {
  const root = document.getElementById('groups');
  for (const [group, devices] of Object.entries(d.firewalls)) {
    const card = document.createElement('div');
    card.className = 'card';
    const head = document.createElement('div');
    head.className = 'card-head';
    head.textContent = `${group} (${devices.length})`;
    card.appendChild(head);

    const table = document.createElement('table');
    table.innerHTML = '<tr><th>Firewall</th><th>Rules</th><th>Zones</th><th>Configuration</th></tr>';
    devices.forEach(dev => {
      const tr = document.createElement('tr');
      const zoneChips = dev.zones.map(z =>
        `<span class="zone-chip" style="background:${zoneColor(z)}">${z}</span>`).join(' ');
      tr.innerHTML = `
        <td><a href="firewall-detail.html?id=${dev.id}">${dev.id}</a></td>
        <td>${dev.rules}</td>
        <td>${zoneChips}</td>
        <td><a href="firewall-detail.html?id=${dev.id}&tab=rules">Rules</a> ·
            <a href="firewall-detail.html?id=${dev.id}&tab=groups">Groups</a> ·
            <a href="firewall-detail.html?id=${dev.id}&tab=iface">Iface</a> ·
            <a href="firewall-detail.html?id=${dev.id}&tab=routing">Routing</a></td>`;
      table.appendChild(tr);
    });
    card.appendChild(table);
    root.appendChild(card);
  }
});

function zoneColor(z) {
  const m = {MGMT:'#c9c9c9', DMZ:'#7fe6e6', WEB:'#7fe6e6', APP:'#9fe08a', DB:'#3fae4a', CORE:'#3fae4a'};
  return m[z] || '#eeeeee';
}
</script>
</body>
</html>
